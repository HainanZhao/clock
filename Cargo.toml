[package]
name = "clock"
version = "0.5.0"
edition = "2021"
description = "A beautiful, configurable clock for your terminal with 11 faces"
license = "MIT"
repository = "https://github.com/hainanzhao/clock"
readme = "README.md"
authors = ["Hainan Zhao"]
publish = false

[[bin]]
name = "clock"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
